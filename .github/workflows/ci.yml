name: CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    name: Verify Multi-Zone Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run lint
          fi

      - name: Type Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run check-types --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run check-types
          fi

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run build --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run build
          fi
